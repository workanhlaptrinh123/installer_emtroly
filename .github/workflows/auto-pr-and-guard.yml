name: Auto PR & Safety Guard

on:
  push:
    branches-ignore:
      - main
    tags-ignore:
      - '*'
  pull_request:
    branches:
      - main

concurrency:
  group: auto-pr-guard-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  pr-safety-guard:
    name: PR Safety Guard (Secrets, SHA-256, Encoding, Conflict)
    runs-on: ubuntu-latest
    steps:
      - name: Check out source with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify repo safety invariants & merge cleanliness
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import pathlib
          import re
          import subprocess
          import sys

          root = pathlib.Path(".")
          errors = []

          # 1. Block forbidden secret/runtime files tracked in Git
          tracked = subprocess.check_output(["git", "ls-files"], text=True).splitlines()
          forbidden_suffixes = (".token", ".secret", ".env", ".sqlite", ".sqlite3", ".db")
          for f in tracked:
              low = f.lower()
              if low == ".env" or low.endswith(forbidden_suffixes) or "/.env" in low:
                  errors.append(f"Forbidden secret/runtime file tracked in Git: {f}")

          # 2. Verify immutable EmTroLy-Setup.exe SHA-256
          stub = root / "windows-installer/bootstrap-stub/EmTroLy-Setup.exe"
          sha_file = root / "windows-installer/bootstrap-stub/EmTroLy-Setup.exe.sha256"
          if stub.is_file() and sha_file.is_file():
              m = re.search(r"\b([a-fA-F0-9]{64})\b", sha_file.read_text(encoding="utf-8"))
              if not m:
                  errors.append("Missing SHA-256 hash in EmTroLy-Setup.exe.sha256")
              else:
                  actual = hashlib.sha256(stub.read_bytes()).hexdigest().lower()
                  if actual != m.group(1).lower():
                      errors.append(f"EmTroLy-Setup.exe SHA-256 drift detected: {actual} != {m.group(1).lower()}")

          # 3. Verify encoding rules (UTF-8 BOM for Windows .ps1, LF for .sh / MANIFEST.txt / unix-installer/*.py)
          bom_files = (
              list((root / "windows-installer").glob("*.ps1"))
              + list((root / "native").glob("*.ps1"))
              + [root / "install-native-windows.ps1"]
          )
          for p in bom_files:
              if p.is_file() and not p.read_bytes().startswith(b"\xef\xbb\xbf"):
                  errors.append(f"Missing UTF-8 BOM on Windows PowerShell script: {p}")

          lf_files = (
              [root / "MANIFEST.txt", root / "install-windows.ps1"]
              + list(root.glob("*.sh"))
              + list((root / "unix-installer").glob("*.py"))
          )
          for p in lf_files:
              if p.is_file():
                  raw = p.read_bytes()
                  if b"\r\n" in raw:
                      errors.append(f"CRLF detected (strict LF required): {p}")
                  if raw.startswith(b"\xef\xbb\xbf"):
                      errors.append(f"Unexpected UTF-8 BOM on LF file: {p}")

          # 4. Syntax-check key Python files
          py_files = [root / "configure.py"] + list((root / "unix-installer").glob("*.py")) + list((root / ".agents/skills/git-team-flow/scripts").glob("*.py"))
          for p in py_files:
              if p.is_file():
                  res = subprocess.run([sys.executable, "-m", "py_compile", str(p)], capture_output=True, text=True)
                  if res.returncode != 0:
                      errors.append(f"Python syntax error in {p}: {res.stderr.strip()}")

          # 5. Non-destructive conflict check against origin/main
          subprocess.run(["git", "fetch", "origin", "main"], check=True)
          mt = subprocess.run(["git", "merge-tree", "--write-tree", "--name-only", "origin/main", "HEAD"], capture_output=True, text=True)
          if mt.returncode != 0:
              errors.append("Merge conflict detected against origin/main:\n" + mt.stdout.strip())

          if errors:
              print("SAFETY GUARD FAILED:", file=sys.stderr)
              for e in errors:
                  print(f"  - {e}", file=sys.stderr)
              sys.exit(1)

          print("PR_SAFETY_GUARD_OK: All security, SHA-256, encoding, syntax, and conflict checks passed.")
          PY

  auto-create-pr:
    name: Auto-Create Pull Request
    if: github.event_name == 'push' && github.ref_name != 'main'
    needs: pr-safety-guard
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Create Pull Request into main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
        run: |
          EXISTING=$(gh pr list --head "$BRANCH" --base main --state open --json number,url --jq '.[0].number // ""')
          if [ -z "$EXISTING" ]; then
            TITLE=$(git log -1 --pretty=%s)
            BODY=$(cat <<EOF
          ### Pull Request tự động từ nhánh \`$BRANCH\`
          - **Người thực hiện:** @$ACTOR
          - **Kiểm tra an toàn (\`PR Safety Guard\`):** ✅ Đã vượt qua (0 conflict, không lọt secret, SHA-256 & encoding chuẩn)
          - **Bước tiếp theo:** Kiểm tra nhanh diff và bấm **Squash and merge** khi sẵn sàng.
          EOF
            )
            PR_URL=$(gh pr create --base main --head "$BRANCH" --title "$TITLE" --body "$BODY")
            echo "Created PR: $PR_URL"
          else
            echo "PR #$EXISTING already exists for $BRANCH and has been updated with latest commits."
          fi
