name: Build Windows Installer

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write

jobs:
  build-windows-installer:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      PYTHON_BIN: python

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install NSIS
        shell: powershell
        run: choco install nsis --yes --no-progress

      - name: Resolve release version
        id: version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" == v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(sed -n 's/^installer_version=//p' MANIFEST.txt | head -n 1)"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "Invalid release version: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building version $version"

      - name: Run installer tests
        run: |
          python -m unittest discover -s windows-installer -p 'test_*.py'
          python native/skills/tao-tro-ly-openclaw-windows-macos-linux/scripts/test_local_native.py WindowsCliTests

      - name: Inject optional Video Factory OAuth config from Repository Secrets
        shell: powershell
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          FB_APP_ID: ${{ secrets.FB_APP_ID }}
          FB_APP_SECRET: ${{ secrets.FB_APP_SECRET }}
        run: |
          if ($env:GOOGLE_OAUTH_CLIENT_ID -or $env:FB_APP_ID) {
            $cfg = @{
              google = @{
                client_id = if ($env:GOOGLE_OAUTH_CLIENT_ID) { $env:GOOGLE_OAUTH_CLIENT_ID } else { "" }
                client_secret = if ($env:GOOGLE_OAUTH_CLIENT_SECRET) { $env:GOOGLE_OAUTH_CLIENT_SECRET } else { "" }
              }
              facebook = @{
                app_id = if ($env:FB_APP_ID) { $env:FB_APP_ID } else { "" }
                app_secret = if ($env:FB_APP_SECRET) { $env:FB_APP_SECRET } else { "" }
              }
            }
            $cfg | ConvertTo-Json -Depth 4 | Set-Content -Path "modules\video-factory-member\installer\app_oauth_config.json" -Encoding utf8
            Write-Host "Injected Video Factory OAuth config from GitHub Secrets."
          }

      - name: Build native bundle
        run: PYTHON_BIN="$PYTHON_BIN" ./build-native-bundle.sh

      - name: Build emtroly.exe
        run: |
          NSIS="/c/Program Files (x86)/NSIS/makensis.exe" \
          PYTHON_BIN="$PYTHON_BIN" \
          RELEASE_VERSION="${{ steps.version.outputs.version }}" \
          ./build-windows-installer.sh emtroly.exe

      - name: Stage immutable EmTroLy-Setup.exe bootstrapper
        shell: powershell
        run: |
          Copy-Item -LiteralPath ./windows-installer/bootstrap-stub/EmTroLy-Setup.exe -Destination ./EmTroLy-Setup.exe -Force
          Copy-Item -LiteralPath ./windows-installer/bootstrap-stub/EmTroLy-Setup.exe.sha256 -Destination ./EmTroLy-Setup.exe.sha256 -Force
          $expected = ([regex]::Match((Get-Content -LiteralPath ./EmTroLy-Setup.exe.sha256 -Raw), '(?i)\b([a-f0-9]{64})\b')).Groups[1].Value.ToLowerInvariant()
          $actual = (Get-FileHash -LiteralPath ./EmTroLy-Setup.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if (-not $expected -or $actual -ne $expected) {
            throw "Immutable EmTroLy-Setup.exe hash mismatch (expected $expected, got $actual)."
          }
          Write-Host "Verified immutable EmTroLy-Setup.exe SHA-256: $actual"

      - name: Sign installer with Authenticode (when certificate secrets are configured)
        if: github.event_name != 'pull_request'
        shell: powershell
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_CODE_SIGNING_ACCOUNT: ${{ secrets.AZURE_CODE_SIGNING_ACCOUNT }}
          AZURE_CERT_PROFILE: ${{ secrets.AZURE_CERT_PROFILE }}
          WINDOWS_PFX_BASE64: ${{ secrets.WINDOWS_PFX_BASE64 }}
          WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
        run: ./windows-installer/sign-release.ps1 -FilePath ./emtroly.exe

      - name: Scan installer with Microsoft Defender
        shell: powershell
        run: |
          $atpPolicy = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Advanced Threat Protection'
          if (Test-Path $atpPolicy) { Set-ItemProperty -Path $atpPolicy -Name ForceDefenderPassiveMode -Value 0 -ErrorAction Stop }
          Start-Service WinDefend -ErrorAction Stop
          Set-MpPreference -DisableRealtimeMonitoring $false -DisableArchiveScanning $false -DisableScriptScanning $false -DisableIOAVProtection $false -DisableBehaviorMonitoring $false
          $preferences = Get-MpPreference
          foreach ($path in $preferences.ExclusionPath) {
            if ($path) { Remove-MpPreference -ExclusionPath $path -ErrorAction Stop }
          }
          $deadline = (Get-Date).AddSeconds(60)
          do {
            $status = Get-MpComputerStatus
            if ($status.RealTimeProtectionEnabled -and $status.AntivirusEnabled) { break }
            Start-Sleep -Seconds 3
          } while ((Get-Date) -lt $deadline)
          $status | Select-Object AMRunningMode, AMServiceEnabled, AntivirusEnabled, RealTimeProtectionEnabled
          ./windows-installer/scan-release.ps1 -FilePath ./emtroly.exe
          ./windows-installer/scan-release.ps1 -FilePath ./EmTroLy-Setup.exe

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: emtroly-${{ steps.version.outputs.version }}-${{ github.run_number }}
          retention-days: 7
          path: |
            emtroly.exe
            emtroly.exe.sha256
            EmTroLy-Setup.exe
            EmTroLy-Setup.exe.sha256
            native-full-bundle.tar.gz
            native-full-bundle.sha256
            MANIFEST.txt
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --latest=false \
            --title "installer_emtroly ${{ steps.version.outputs.version }}" \
            --generate-notes 2>/dev/null || true
          gh release upload "$GITHUB_REF_NAME" --clobber \
            emtroly.exe \
            emtroly.exe.sha256 \
            EmTroLy-Setup.exe \
            EmTroLy-Setup.exe.sha256 \
            native-full-bundle.tar.gz \
            native-full-bundle.sha256 \
            MANIFEST.txt
          gh release edit "$GITHUB_REF_NAME" --latest

      - name: Attach immutable EmTroLy-Setup.exe to latest release if missing
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $raw = (& gh release view --json tagName,assets 2>$null | Out-String).Trim()
          if (-not $raw) { exit 0 }
          $rel = $raw | ConvertFrom-Json
          $names = @($rel.assets | ForEach-Object { [string]$_.name })
          if ('EmTroLy-Setup.exe' -notin $names) {
            Write-Host "Attaching immutable EmTroLy-Setup.exe to existing release $($rel.tagName)..."
            & gh release upload $rel.tagName EmTroLy-Setup.exe EmTroLy-Setup.exe.sha256
            if ($LASTEXITCODE -ne 0) { throw "Failed to attach EmTroLy-Setup.exe to $($rel.tagName)" }
          } else {
            Write-Host "Release $($rel.tagName) already has EmTroLy-Setup.exe."
          }
