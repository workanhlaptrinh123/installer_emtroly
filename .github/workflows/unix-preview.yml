name: Build macOS and Ubuntu Preview

on:
  workflow_dispatch:
    inputs:
      target:
        description: Preview platform; manual runs consume Actions minutes
        type: choice
        required: true
        options:
          - ubuntu-x64
          - macos-arm64
          - macos-x64
      live_test:
        description: Run network integration with fake credentials (slower)
        type: boolean
        default: false
      systemd_test:
        description: Test a temporary user service on the disposable Ubuntu runner
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  preview:
    runs-on: ${{ fromJSON('{"ubuntu-x64":"ubuntu-22.04","macos-arm64":"macos-15","macos-x64":"macos-15-intel"}')[inputs.target] }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Ubuntu Tk libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3-tk

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tools
        run: |
          python3 -c 'import tkinter, sqlite3'
          python3 -m pip install 'pyinstaller==6.17.0'

      - name: Run isolated tests
        run: |
          python3 -m unittest discover -s unix-installer -p 'test_*.py'
          python3 -m unittest discover -s native -p test_install_unix_cli.py

      - name: Run OpenClaw and Zalo integration with fake credentials
        if: inputs.live_test
        run: UNIX_INSTALLER_LIVE_TEST=1 python3 -m unittest discover -s unix-installer -p test_live_integration.py

      - name: Build preview
        env:
          OUTPUT: ${{ runner.temp }}/unix-preview
        run: bash unix-installer/build-preview.sh

      - name: Package Ubuntu preview as deb
        if: runner.os == 'Linux'
        env:
          OUTPUT: ${{ runner.temp }}/unix-preview
        run: |
          python3 unix-installer/build-ubuntu-deb.py \
            "$OUTPUT/dist/caidattroly-ubuntu-x64-PREVIEW" \
            "$OUTPUT/caidattroly-ubuntu-x64-PREVIEW.deb" --architecture amd64 --minimum-glibc 2.35

      - name: Smoke-test deb on clean Ubuntu 22.04
        if: runner.os == 'Linux' && inputs.live_test
        env:
          OUTPUT: ${{ runner.temp }}/unix-preview
        run: |
          docker run --rm --memory=1g --pids-limit=192 \
            -v "$OUTPUT:/pkg:ro" \
            -v "$GITHUB_WORKSPACE/unix-installer/frozen_smoke.py:/tmp/frozen_smoke.py:ro" \
            ubuntu:22.04 /bin/bash -euc '
              apt-get update -qq
              DEBIAN_FRONTEND=noninteractive apt-get install -y -qq /pkg/caidattroly-ubuntu-x64-PREVIEW.deb
              /usr/lib/installer-emtroly/caidattroly --run-python-script /tmp/frozen_smoke.py
            '

      - name: Smoke-test packaged helper and payload
        shell: bash
        env:
          OUTPUT: ${{ runner.temp }}/unix-preview
        run: |
          if [[ "$RUNNER_OS" == macOS ]]; then
            name="caidattroly-${{ inputs.target }}-PREVIEW"
            executable="$OUTPUT/dist/$name.app/Contents/MacOS/$name"
          else
            executable="$OUTPUT/dist/caidattroly-${{ inputs.target }}-PREVIEW"
          fi
          "$executable" --run-python-script "$GITHUB_WORKSPACE/unix-installer/frozen_smoke.py"

      - name: Test packaged OpenClaw and Zalo with fake credentials
        if: inputs.live_test
        shell: bash
        env:
          OUTPUT: ${{ runner.temp }}/unix-preview
        run: |
          name="caidattroly-${{ inputs.target }}-PREVIEW"
          if [[ "$RUNNER_OS" == macOS ]]; then
            executable="$OUTPUT/dist/$name.app/Contents/MacOS/$name"
          else
            executable="$OUTPUT/dist/$name"
          fi
          "$executable" --run-python-script "$GITHUB_WORKSPACE/unix-installer/frozen_integration.py"

      - name: Test isolated Ubuntu systemd user service
        if: inputs.systemd_test && runner.os == 'Linux'
        shell: bash
        env:
          OUTPUT: ${{ runner.temp }}/unix-preview
        run: |
          sudo loginctl enable-linger "$(id -un)"
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          systemctl --user show-environment >/dev/null
          "$OUTPUT/dist/caidattroly-ubuntu-x64-PREVIEW" --run-python-script \
            "$GITHUB_WORKSPACE/unix-installer/frozen_systemd_integration.py"

      - name: Upload preview only
        uses: actions/upload-artifact@v4
        with:
          name: preview-${{ inputs.target }}-${{ github.run_number }}
          retention-days: 7
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/unix-preview/*-PREVIEW.zip
            ${{ runner.temp }}/unix-preview/*-PREVIEW.zip.sha256
            ${{ runner.temp }}/unix-preview/*-PREVIEW.tar.gz
            ${{ runner.temp }}/unix-preview/*-PREVIEW.tar.gz.sha256
            ${{ runner.temp }}/unix-preview/*-PREVIEW.deb
            ${{ runner.temp }}/unix-preview/*-PREVIEW.deb.sha256
